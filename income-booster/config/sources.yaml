# Where to scan, and how much to trust what comes back.
#
# Tiering is the difference between this system and a slop firehose. The rule:
# a demand signal outranks a thousand blog posts. Someone posting a budget is
# evidence; someone posting a listicle is not.

tiers:
  A:
    label: "Primary and demand-side"
    trust: high
    note: >-
      Vendor primary sources, and above all ACTUAL DEMAND: people with budgets
      looking for someone. A live job post beats any amount of commentary.
  B:
    label: "Practitioner reports"
    trust: medium
    note: >-
      Named individuals reporting real numbers from work they actually did.
      Credible in proportion to specificity and to whether the number is
      sustained rather than a launch-week spike.
  C:
    label: "Aggregators and content marketing"
    trust: none
    note: >-
      Listicles, roundups, vendor blogs, course funnels. NEVER scored on their
      own — usable only as a pointer to a Tier A/B source. Tier C alone is an
      automatic reject. Most of what a naive search returns lands here.

sources:
  # --- Tier A: capability changes that create new sellable services ---------
  - { tier: A, name: "Anthropic news",        url: "https://www.anthropic.com/news",           cadence: weekly }
  - { tier: A, name: "Claude release notes",  url: "https://docs.claude.com/en/release-notes/overview", cadence: weekly }
  - { tier: A, name: "OpenAI news",           url: "https://openai.com/news/",                 cadence: weekly }
  - { tier: A, name: "Google AI blog",        url: "https://blog.google/technology/ai/",       cadence: weekly }
  - { tier: A, name: "xAI news",              url: "https://x.ai/news",                        cadence: weekly }

  # --- Tier A: demand signals. The most valuable sources in this file. ------
  # Searched with the operator's domain terms injected, not scanned wholesale.
  - { tier: A, name: "Upwork AI automation",  url: "https://www.upwork.com/nx/search/jobs/?q=ai%20automation", cadence: weekly, kind: demand }
  - { tier: A, name: "Contra AI projects",    url: "https://contra.com/search",                cadence: weekly, kind: demand }
  - { tier: A, name: "HN Who is Hiring",      url: "https://hn.algolia.com/?query=Ask%20HN%20Who%20is%20hiring", cadence: monthly, kind: demand }
  - { tier: A, name: "HN Freelancer thread",  url: "https://hn.algolia.com/?query=Ask%20HN%20freelancer%20seeking%20freelancer", cadence: monthly, kind: demand }

  # --- Tier B: practitioners reporting real numbers ------------------------
  - { tier: B, name: "Hacker News front",     url: "https://news.ycombinator.com/best",        cadence: weekly }
  - { tier: B, name: "Indie Hackers",         url: "https://www.indiehackers.com/products",    cadence: weekly }
  - { tier: B, name: "r/consulting",          url: "https://www.reddit.com/r/consulting/top/?t=week", cadence: weekly }
  - { tier: B, name: "r/smallbusiness",       url: "https://www.reddit.com/r/smallbusiness/top/?t=week", cadence: weekly, kind: demand }

# Queries run each scan. `{domain}` is expanded once per entry in
# profile.operator.domains — which is why leaving domains empty cripples the scan:
# these become generic searches returning generic answers.
queries:
  demand_side:
    - "{domain} consultant hiring AI automation budget"
    - "{domain} businesses paying for AI workflow 2026"
    - '"looking for" AI {domain} contractor rate'
  capability_side:
    - "new Claude capability {domain} service opportunity"
    - "AI agents {domain} small business case study revenue"
  pricing:
    - "{domain} AI consulting retainer pricing 2026"

# Phrases that mark a page as slop. Their presence is not an automatic reject on
# its own, but it forces Tier C classification regardless of where the page sits.
slop_markers:
  - "passive income"
  - "while you sleep"
  - "guaranteed earnings"
  - "no skills required"
  - "faceless"
  - "get rich"
  - "this one trick"
  - "copy my system"

# Deliberately excluded. Each of these reliably produces confident, unfalsifiable
# income claims, and including them costs more scan budget than it returns.
excluded_domains:
  - medium.com          # unverifiable first-person income claims at scale
  - udemy.com           # courses about making money are not evidence of making money
  - gumroad.com
  - youtube.com         # thumbnails are not data
