# Deterministic scoring rubric. Dimensions are scored 0-5 by the scanning
# agent, then weighted and normalized to 0-100 by lib/score.mjs.
#
# The two NEGATIVE weights are the heart of this rubric. Most AI-income advice
# is written for people who build things themselves. This operator does not.
# Without an explicit penalty on their own build hours, the system would
# relentlessly propose work they cannot execute.

promote_threshold: 65
max_proposals_per_digest: 3

weights:
  demand_evidence: 3.0          # is someone already paying, with a number?
  days_to_first_dollar: 2.5     # inverted: <=14d scores 5
  operator_fit: 2.5             # leans on domain expertise + selling
  agent_leverage: 2.0           # share of work an agent can do unattended
  moat: 1.0                     # repeatable and not trivially copied
  operator_build_burden: -2.0   # PENALTY: operator's own non-selling hours
  risk: -1.5                    # PENALTY: capital, reputation, legal, ToS

# Gates that must pass in addition to the score threshold. A high score cannot
# override these.
gates:
  min_demand_evidence: 3
  # A build-velocity claim ("made a store in an hour", "shipped an app in a
  # weekend") is NOT a demand signal. It measures how fast the tool works, not
  # whether anyone paid. These claims dominate AI-income content because they
  # are cheap to produce and impressive to watch. When the only evidence is a
  # velocity claim, demand_evidence is capped at 1 and the candidate cannot
  # clear min_demand_evidence.
  velocity_claim_caps_demand_at: 1
  # Sustained revenue means >=30 days of continued earnings. A first-day or
  # first-week number is a launch spike: friends, the author's own audience,
  # and curiosity traffic. It does not survive contact with week three.
  require_sustained_revenue_days: 30
  max_risk: 2
  require_independent_corroboration: true
  allowed_corroboration_tiers: [A, B]

# Scoring anchors, so that scores mean the same thing across runs and across
# different agent sessions. The scanning agent is instructed to quote the
# anchor it matched.
anchors:
  demand_evidence:
    5: "Live job posts / RFPs with stated budgets, or a named operator invoicing for exactly this, multiple independent instances"
    3: "A named practitioner reports real revenue for this, corroborated once"
    1: "Plausible market reasoning, no one observed paying"
    0: "Assertion only"
  days_to_first_dollar:
    5: "<=14 days: buyers reachable now, deliverable exists or is days away"
    3: "15-30 days"
    1: "31-90 days"
    0: ">90 days"
  operator_fit:
    5: "Wins BECAUSE of their domain expertise and ability to sell; a generic builder could not do it"
    3: "Their skills help but are not the edge"
    1: "Skills largely irrelevant"
    0: "Requires capabilities they lack outright"
  agent_leverage:
    5: "Agent does essentially all production work unattended; operator sells and reviews"
    3: "Agent does about half; operator does meaningful non-selling work"
    1: "Agent only assists at the margins"
  moat:
    5: "Repeat/recurring revenue, compounding relationships, hard to copy"
    3: "Repeatable with effort"
    1: "One-off, trivially copied"
  operator_build_burden:
    0: "Selling and reviewing only — no build hours"
    2: "A few hours a week of non-selling work"
    5: "Dozens of hours of hands-on work they would have to do personally"
  risk:
    0: "No capital, no reputational exposure, no platform dependency"
    2: "Small capital, recoverable; some platform dependency"
    5: "Meaningful capital at risk, legal/ToS exposure, or reputation-staking"
