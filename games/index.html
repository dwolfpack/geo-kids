<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4EFEE">
<title>משחקי מסחר 💰</title>
<style>
  :root {
    --bg: #E4EFEE; --card: #FFFCF3; --ink: #1E2C2A; --ink-soft: #5B6D69;
    --coral: #D6553B; --sky: #2E7D96; --leaf: #4C9166; --sun: #E0A83E; --berry: #A6567D;
    --line: #D7E3DE; --radius: 20px; --shadow: 0 4px 14px rgba(20,35,33,.09);
    --font: "Heebo", "Rubik", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font); color: var(--ink); min-height: 100vh;
    background-color: var(--bg);
    background-image: radial-gradient(circle at 1px 1px, rgba(30,44,42,.07) 1px, transparent 0);
    background-size: 22px 22px;
    overflow-x: hidden;
  }
  .wrap {
    max-width: 760px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 14px; }
  .pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 48px; min-width: 48px; padding: 0 16px;
    background: var(--card); border: 2px solid var(--line); border-radius: 999px;
    color: var(--ink); text-decoration: none; font: 700 .95rem var(--font);
    box-shadow: var(--shadow); cursor: pointer; touch-action: manipulation;
  }
  .pill:focus-visible, .card:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
  header { text-align: center; margin: 6px 0 20px; }
  h1 { font-size: clamp(1.8rem, 7vw, 2.6rem); letter-spacing: -.5px; }
  header p { color: var(--ink-soft); margin-top: 6px; font-size: 1.05rem; }
  .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
    padding: 16px; min-height: 96px; text-decoration: none; color: inherit;
    box-shadow: var(--shadow); touch-action: manipulation;
    transition: transform .15s ease;
  }
  .card:active { transform: scale(.97); }
  .card .ico {
    flex: 0 0 64px; height: 64px; border-radius: 18px; display: grid; place-items: center;
    font-size: 2.1rem; background: var(--accent); box-shadow: inset 0 -4px 0 rgba(0,0,0,.12);
  }
  .card h2 { font-size: 1.2rem; }
  .card p { color: var(--ink-soft); font-size: .92rem; margin-top: 2px; }
  .card .tag { display: inline-block; margin-top: 6px; font-size: .78rem; font-weight: 700; color: var(--ink-soft); }
  footer { text-align: center; color: var(--ink-soft); font-size: .85rem; margin-top: 24px; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="pill" id="back" href="../geo-kids/">🌍 <span id="back-label">מסע סביב העולם</span></a>
    <button class="pill" id="lang" type="button" onclick="toggleLang()">English</button>
  </div>
  <header>
    <h1 id="title">משחקי מסחר 💰</h1>
    <p id="subtitle">קונים בזול, מוכרים ביוקר — ולומדים על העולם!</p>
  </header>
  <main class="grid" id="grid"></main>
  <footer id="footer">בלי פרסומות, בלי קניות, בלי מעקב. ההתקדמות נשמרת רק במכשיר שלכם.</footer>
</div>
<script>
  // Hub for the trading games. Each game lives in its own folder and merges
  // independently, so this page only links to them.
  var GAMES = [
    { dir: "pirate-trader", ico: "🏴‍☠️", accent: "#9BD1E0",
      he: ["סוחר הים", "מפליגים בין נמלים אמיתיים, קונים תבלינים ומשי ומתחמקים משודדי ים!"],
      en: ["Pirate Trader", "Sail between real ports, trade spices and silk, and dodge pirates!"] },
    { dir: "merchant-caravan", ico: "🐫", accent: "#F2D29B",
      he: ["שיירת הסוחרים", "מובילים גמלים בדרך המשי, ממלאים הזמנות ופותחים דרכים חדשות."],
      en: ["Merchant Caravan", "Lead camels along the Silk Road, fill orders and open new roads."] },
    { dir: "lemonade-empire", ico: "🍋", accent: "#FBE7A1",
      he: ["אימפריית הלימונדה", "מדוכן אחד לרשת עולמית! קובעים מחיר, שוכרים עוזרים ומרוויחים."],
      en: ["Lemonade Empire", "From one stand to a world chain! Set prices, hire helpers, grow."] },
    { dir: "island-shop", ico: "🏝️", accent: "#BFE3C6",
      he: ["החנות באי", "קונים סחורה מספינות שמגיעות, קובעים מחירים ומשמחים לקוחות."],
      en: ["Island Shop", "Stock goods from visiting ships, price them and keep customers happy."] },
    { dir: "kids-market", ico: "📈", accent: "#E6C6DA",
      he: ["שוק הילדים", "קונים מניות בחברות מצחיקות וקוראים חדשות שמזיזות את המחירים."],
      en: ["Kids Market", "Buy shares in silly companies and read the news that moves prices."] }
  ];
  var TEXT = {
    he: { title: "משחקי מסחר 💰", subtitle: "קונים בזול, מוכרים ביוקר — ולומדים על העולם!", back: "מסע סביב העולם",
          other: "English", footer: "בלי פרסומות, בלי קניות, בלי מעקב. ההתקדמות נשמרת רק במכשיר שלכם.", play: "▶ לשחק" },
    en: { title: "Trading Games 💰", subtitle: "Buy low, sell high — and learn about the world!", back: "Around the World",
          other: "עברית", footer: "No ads, no purchases, no tracking. Progress is saved only on your device.", play: "▶ Play" }
  };
  function getLang() {
    try { return localStorage.getItem("geo-lang") === "en" ? "en" : "he"; } catch (e) { return "he"; }
  }
  var lang = getLang();
  function render() {
    var T = TEXT[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
    document.title = T.title;
    document.getElementById("title").textContent = T.title;
    document.getElementById("subtitle").textContent = T.subtitle;
    document.getElementById("back-label").textContent = T.back;
    document.getElementById("lang").textContent = T.other;
    document.getElementById("footer").textContent = T.footer;
    var grid = document.getElementById("grid");
    grid.innerHTML = "";
    GAMES.forEach(function (g) {
      var a = document.createElement("a");
      a.className = "card";
      a.href = g.dir + "/";
      a.style.setProperty("--accent", g.accent);
      a.innerHTML = '<span class="ico" aria-hidden="true"></span><span><h2></h2><p></p><span class="tag"></span></span>';
      a.querySelector(".ico").textContent = g.ico;
      a.querySelector("h2").textContent = g[lang][0];
      a.querySelector("p").textContent = g[lang][1];
      a.querySelector(".tag").textContent = T.play;
      grid.appendChild(a);
    });
  }
  function toggleLang() {
    lang = lang === "he" ? "en" : "he";
    try { localStorage.setItem("geo-lang", lang); } catch (e) {}
    render();
  }
  render();
</script>
</body>
</html>
