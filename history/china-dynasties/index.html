    if (!d.div) ctx.fillText(d.py, tx, 160);
    var f1 = fmtYear(d.from, T), f2 = fmtYear(d.to, T);
    var yrs = d.from < 0 && d.to < 0 ? f1.n + "–" + f2.n + " " + T.bce
      : d.from < 0 ? f1.n + " " + T.bce + " – " + f2.n + " " + T.ce : f1.n + "–" + f2.n + " " + T.ce;
    if (rtl) yrs = yrs.replace(/(\d+)–(\d+)/, "\u2066$1–$2\u2069");
    ctx.font = F(30, 700); ctx.fillStyle = "#A39A8A";
    ctx.fillText(yrs, tx, d.div ? 162 : 210);
    ctx.restore();

    // duration bar
    var bu = easeOut(seg(lt, 0.3, 0.9)), by = 300;
    ctx.save(); ctx.globalAlpha *= seg(lt, 0.25, 0.4);
    ctx.textAlign = al; ctx.textBaseline = "alphabetic"; ctx.font = F(36, 900); ctx.fillStyle = "#F3EAD8";
    var shown = Math.round(d.years * bu);
    ctx.fillText("⏳ " + T.yearsLong(shown.toLocaleString("en-US")), X(PX), by);
    rr(ctx, PX, by + 18, PW, 20, 10); ctx.fillStyle = "#232933"; ctx.fill();
    var bw = Math.max(20, PW * d.years / MAXY * bu);
    rr(ctx, rtl ? PX + PW - bw : PX, by + 18, bw, 20, 10); ctx.fillStyle = d.div ? "#6B7079" : d.col; ctx.fill();
    // ticks for scale: 100-year marks
    ctx.fillStyle = "rgba(10,12,16,0.55)";
    for (var yy = 100; yy < MAXY; yy += 100) { var tx2 = PX + PW * yy / MAXY; ctx.fillRect(rtl ? 2 * PX + PW - tx2 : tx2, by + 18, 2, 20); }
    ctx.restore();

    // facts
    var fy = 405;
    d.facts[lang].forEach(function (fact, k) {
      var parts = fact.split("|"), fa = seg(lt, 0.45 + k * 0.38, 0.75 + k * 0.38);
      if (fa <= 0) return;
      ctx.save(); ctx.globalAlpha *= fa;
      ctx.translate(0, 18 * (1 - easeOut(fa)));
      rr(ctx, PX, fy - 4, PW, 104, 18); ctx.fillStyle = "rgba(255,255,255,0.045)"; ctx.fill();
      ctx.fillStyle = hexA(d.col, 0.9); rr(ctx, rtl ? PX + PW - 6 : PX, fy - 4, 6, 104, 3); ctx.fill();
      ctx.font = "50px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.direction = "ltr";
      ctx.fillText(parts[0], X(PX + 50), fy + 48);
      ctx.direction = rtl ? "rtl" : "ltr"; ctx.textAlign = al; ctx.textBaseline = "middle"; ctx.font = F(31, 700); ctx.fillStyle = "#F3EAD8";
      var lines = wrap(ctx, parts[1], PW - 120);
      if (lines.length > 2) { ctx.font = F(27, 700); lines = wrap(ctx, parts[1], PW - 120); }
      lines.slice(0, 3).forEach(function (ln, j) { ctx.fillText(ln, X(PX + 96), fy + 48 + (j - (Math.min(lines.length, 3) - 1) / 2) * 38); });
      ctx.restore();
      fy += 122;
    });

    // population
    if (d.pop) {
      var pa = seg(lt, 1.15, 1.45), pu = easeOut(seg(lt, 1.2, 1.8)), py = 690;
      ctx.save(); ctx.globalAlpha *= pa;
      ctx.textAlign = al; ctx.textBaseline = "alphabetic"; ctx.font = F(32, 800); ctx.fillStyle = "#F3EAD8";
      ctx.fillText("👥 " + T.pop(Math.round(d.pop * pu)), X(PX), py);
      ctx.font = F(20, 600); ctx.fillStyle = "#8C8576";
      ctx.textAlign = rtl ? "left" : "right"; ctx.fillText(T.popNote, X(PX + PW), py);
      rr(ctx, PX, py + 16, PW, 16, 8); ctx.fillStyle = "#232933"; ctx.fill();
      var pw = Math.max(16, PW * d.pop / MAXPOP * pu);
      rr(ctx, rtl ? PX + PW - pw : PX, py + 16, pw, 16, 8); ctx.fillStyle = "#E8DCC2"; ctx.fill();
      // little people dots: one per 10 million
      var n = Math.round(d.pop / 10 * pu);
      for (var q = 0; q < n; q++) {
        var col = q % 43, row = Math.floor(q / 43);
        ctx.fillStyle = hexA(d.col, 0.85);
        ctx.beginPath(); ctx.arc(X(PX + 7 + col * 14.2), py + 52 + row * 14, 4.6, 0, 6.283); ctx.fill();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  // ---------- intro & finale ----------
  function drawIntro(ctx, t, T) {
    if (t > T_INTRO + 0.1) return;
    var a = seg(t, 0, 0.5) * (1 - seg(t, T_INTRO - 0.45, T_INTRO));
    var rise = easeOut(seg(t, 0, 0.8));
    ctx.save(); ctx.globalAlpha = a;
    var g = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 900);
    g.addColorStop(0, "rgba(10,12,16,0.85)"); g.addColorStop(1, "rgba(10,12,16,0.35)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // the ten dynasty glyphs fan out
    REAL.forEach(function (d, k) {
      var gu = back(seg(t, 0.25 + k * 0.07, 0.6 + k * 0.07));
      if (gu <= 0) return;
      var x = W / 2 + (k - 4.5) * 132, y = 300;
      ctx.save(); ctx.translate(x, y); ctx.scale(gu, gu);
      rr(ctx, -54, -54, 108, 108, 16); ctx.fillStyle = d.col; ctx.fill();
      ctx.fillStyle = "#14161B"; ctx.font = FSC(72); ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(d.ch, 0, 4); ctx.restore();
    });
    ctx.direction = lang === "he" ? "rtl" : "ltr";
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.translate(0, 30 * (1 - rise));
    ctx.font = F(124, 900); ctx.fillStyle = "#F3EAD8"; ctx.fillText(T.title, W / 2, 520);
    ctx.font = F(68, 800); ctx.fillStyle = "#E8B34B"; ctx.fillText(T.title2, W / 2, 615);
    ctx.font = F(36, 500); ctx.fillStyle = "#C9C0AE"; ctx.globalAlpha *= seg(t, 0.7, 1.2);
    ctx.fillText(T.sub, W / 2, 690);
    ctx.restore();
  }

  function drawFinale(ctx, t, T) {
    if (t < T_FINALE) return;
    var rtl = lang === "he";
    function X(x) { return rtl ? 2 * PX + PW - x : x; }
    var a = seg(t, T_FINALE, T_FINALE + 0.35);
    ctx.save(); ctx.globalAlpha = a; ctx.direction = rtl ? "rtl" : "ltr";
    ctx.textAlign = rtl ? "right" : "left"; ctx.textBaseline = "alphabetic";
    ctx.font = F(52, 900); ctx.fillStyle = "#F3EAD8"; ctx.fillText("🏆 " + T.finaleQ, X(PX), 112, PW);
    var sorted = REAL.slice().sort(function (p, q) { return q.years - p.years; });
    sorted.forEach(function (d, k) {
      var y = 160 + k * 60, u = easeOut(seg(t, T_FINALE + 0.2 + k * 0.1, T_FINALE + 0.9 + k * 0.1));
      if (u <= 0) return;
      ctx.save(); ctx.globalAlpha *= Math.min(1, u * 2);
      ctx.font = FSC(36); ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = d.col; ctx.direction = "ltr";
      ctx.fillText(d.ch, X(PX + 22), y + 22);
      var maxW = PW - 290, bw = Math.max(8, maxW * d.years / MAXY * u), bx = PX + 56;
      rr(ctx, rtl ? 2 * PX + PW - bx - bw : bx, y + 6, bw, 32, 8); ctx.fillStyle = d.col; ctx.fill();
      ctx.direction = rtl ? "rtl" : "ltr"; ctx.textAlign = rtl ? "right" : "left";
      ctx.font = F(26, 800); ctx.fillStyle = "#F3EAD8";
      ctx.fillText(Math.round(d.years * u) + " " + T.years + "  " + (lang === "he" ? d.name.he.replace("שושלת ", "") : d.py), X(bx + bw + 12), y + 23);
      ctx.restore();
    });
    // closing lines
    var e = seg(t, T_FINALE + 1.9, T_FINALE + 2.4);
    ctx.globalAlpha = a * e;
    ctx.textAlign = rtl ? "right" : "left"; ctx.textBaseline = "alphabetic";
    ctx.font = F(30, 800); ctx.fillStyle = "#E8B34B"; ctx.fillText("👑 " + T.end1, X(PX), 800, PW);
    ctx.font = F(26, 700); ctx.fillStyle = "#F3EAD8"; ctx.fillText("🇨🇳 " + T.today, X(PX), 846, PW);
    ctx.font = F(18, 500); ctx.fillStyle = "#8C8576"; ctx.fillText(T.end2, X(PX), 884, PW);
    ctx.restore();
  }

  function vignette(ctx) {
    var g = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.05);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.45)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  function render(ctx, t) {
    var T = TXT[lang];
    ctx.save();
    drawBackground(ctx, t);
    drawMap(ctx, t, T);
    drawHeader(ctx, t, T);
    drawPanel(ctx, t, T);
    drawFinale(ctx, t, T);
    drawTimeline(ctx, t, T);
    drawIntro(ctx, t, T);
    vignette(ctx);
    ctx.restore();
  }

  // ---------- sound (synthesized, no files) ----------
  var PENTA = [293.66, 349.23, 392.0, 440.0, 523.25, 587.33, 698.46, 783.99, 880.0];
  var CUES = [{ t: 0.05, k: "gong" }];
  DYN.forEach(function (d, i) {
    if (d.div) CUES.push({ t: d.t0, k: "drum" });
    else { CUES.push({ t: d.t0, k: "pluck", f: PENTA[i % 5 + 2] }); CUES.push({ t: d.t0 + 0.18, k: "pluck", f: PENTA[i % 5 + 4] }); }
  });
  CUES.push({ t: T_FINALE, k: "gong" });
  REAL.forEach(function (d, k) { CUES.push({ t: T_FINALE + 0.2 + k * 0.1, k: "pluck", f: PENTA[8 - (k % 9)], soft: true }); });
  window.__CUES = CUES;

  var actx = null, soundOn = true;
  try { soundOn = localStorage.getItem("geo-sound") !== "off"; } catch (e) {}
  function playCue(c) {
    if (!actx || !soundOn) return;
    var now = actx.currentTime, o, g, i;
    if (c.k === "pluck") {
      for (i = 1; i <= 3; i++) {
        o = actx.createOscillator(); g = actx.createGain();
        o.type = i === 1 ? "triangle" : "sine"; o.frequency.value = c.f * i;
        var v = (c.soft ? 0.06 : 0.12) / i;
        g.gain.setValueAtTime(v, now); g.gain.exponentialRampToValueAtTime(0.0001, now + 1.2 / i);
        o.connect(g).connect(actx.destination); o.start(now); o.stop(now + 1.3);
      }
    } else if (c.k === "gong") {
      [1, 1.48, 2.03, 2.74, 3.6].forEach(function (m, j) {
        o = actx.createOscillator(); g = actx.createGain();
        o.frequency.value = 98 * m; o.type = "sine";
        g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.16 / (j + 1), now + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 3.2 - j * 0.4);
        o.connect(g).connect(actx.destination); o.start(now); o.stop(now + 3.3);
      });
    } else if (c.k === "drum") {
      o = actx.createOscillator(); g = actx.createGain();
      o.frequency.setValueAtTime(140, now); o.frequency.exponentialRampToValueAtTime(50, now + 0.3);
      g.gain.setValueAtTime(0.35, now); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
      o.connect(g).connect(actx.destination); o.start(now); o.stop(now + 0.6);
    }
  }

  // ---------- player ----------
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var t = 0, playing = false, speed = 1, last = 0, dpr = 1;
  var EXPORT = /[?&]export\b/.test(location.search);

  function resize() {
    dpr = EXPORT ? 1 : Math.min(2, window.devicePixelRatio || 1);
    var w = EXPORT ? W : cv.clientWidth * dpr;
    cv.width = Math.round(w); cv.height = Math.round(w * 9 / 16);
    draw();
  }
  function draw() {
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
    render(ctx, t);
    var s = Math.floor(t);
    document.getElementById("time").textContent = "0:" + (s < 10 ? "0" : "") + s;
    document.getElementById("scrub").value = t;
  }
  function frame(now) {
    if (!playing) return;
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    var nt = Math.min(DURATION, t + dt * speed);
    CUES.forEach(function (c) { if (c.t > t && c.t <= nt) playCue(c); });
    t = nt; draw();
    if (t >= DURATION) { setPlaying(false); return; }
    requestAnimationFrame(frame);
  }
  function setPlaying(p) {
    playing = p;
    document.getElementById("play").textContent = p ? "❚❚" : "▶";
    document.getElementById("bigplay").hidden = EXPORT || p || (t > 0 && t < DURATION);
    if (p) {
      if (!actx && soundOn) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      if (actx && actx.state === "suspended") actx.resume();
      if (t >= DURATION) t = 0;
      if (t === 0) playCue(CUES[0]);
      last = performance.now(); requestAnimationFrame(frame);
    }
  }
  function applyLang() {
    var T = TXT[lang];
    document.documentElement.lang = lang; document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
    document.title = T.page;
    document.getElementById("back-label").textContent = T.back;
    document.getElementById("lang").textContent = T.other;
    document.getElementById("note").textContent = T.note;
    cv.setAttribute("aria-label", T.page);
    draw();
  }

  document.getElementById("play").onclick = function () { setPlaying(!playing); };
  document.getElementById("bigplay").onclick = function () { setPlaying(true); };
  document.getElementById("restart").onclick = function () { t = 0; setPlaying(true); };
  document.getElementById("scrub").oninput = function (e) { t = +e.target.value; draw(); if (!playing) document.getElementById("bigplay").hidden = true; };
  document.getElementById("speed").onclick = function (e) { speed = speed === 1 ? 0.5 : 1; e.target.textContent = speed === 1 ? "1×" : "½×"; };
  document.getElementById("sound").onclick = function (e) {
    soundOn = !soundOn; e.target.textContent = soundOn ? "🔊" : "🔇";
    try { localStorage.setItem("geo-sound", soundOn ? "on" : "off"); } catch (er) {}
  };
  document.getElementById("sound").textContent = soundOn ? "🔊" : "🔇";
  document.getElementById("lang").onclick = function () {
    lang = lang === "he" ? "en" : "he";
    try { localStorage.setItem("geo-lang", lang); } catch (e) {}
    applyLang();
  };
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" && e.target === document.body) { e.preventDefault(); setPlaying(!playing); }
  });
  window.addEventListener("resize", resize);

  // Hooks for the video exporter (tools/export-video.js).
  window.__render = function (time, l) { if (l) lang = l; t = time; draw(); };
  window.__duration = DURATION;

  var params = new URLSearchParams(location.search);
  if (params.get("lang") === "en" || params.get("lang") === "he") lang = params.get("lang");
  var fontsReady = Promise.all([
    document.fonts.load(F(40, 900), "אבג abc"), document.fonts.load(F(40, 500), "אבג āō"), document.fonts.load(FSC(40), "商周秦汉隋唐宋元明清")
  ]).catch(function () {});
  fontsReady.then(function () {
    window.__ready = true;
    if (EXPORT) document.getElementById("bigplay").hidden = true;
    applyLang(); resize();
    if (params.has("t")) { t = +params.get("t"); draw(); document.getElementById("bigplay").hidden = true; }
  });
})();
</script>
</body>
