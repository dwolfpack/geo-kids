<svg viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="550" fill="#f3f0ea"/>
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c2a26">What a Field Check Sees vs. What a Human Sees</text>

  <!-- left: script view -->
  <rect x="60" y="90" width="360" height="360" rx="14" fill="#e4ddce" stroke="#8a7d63" stroke-width="2"/>
  <text x="240" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c2a26">Validation script sees</text>

  <rect x="90" y="150" width="300" height="46" rx="6" fill="#3f6f5e"/>
  <text x="240" y="178" text-anchor="middle" font-size="13" fill="#f3f0ea">capital.he: "סאות' טראווה" ✓ present</text>

  <rect x="90" y="210" width="300" height="46" rx="6" fill="#3f6f5e"/>
  <text x="240" y="238" text-anchor="middle" font-size="13" fill="#f3f0ea">fact.he: "..." ✓ present</text>

  <rect x="90" y="270" width="300" height="46" rx="6" fill="#3f6f5e"/>
  <text x="240" y="298" text-anchor="middle" font-size="13" fill="#f3f0ea">code: "KI" ✓ unique</text>

  <rect x="90" y="340" width="300" height="80" rx="8" fill="#2c2a26"/>
  <text x="240" y="368" text-anchor="middle" font-size="13" fill="#f3f0ea" font-weight="bold">Verdict: all checks pass</text>
  <text x="240" y="390" text-anchor="middle" font-size="11" fill="#f3f0ea">structurally complete</text>

  <!-- right: human view -->
  <rect x="480" y="90" width="360" height="360" rx="14" fill="#f0e2d9" stroke="#b5482f" stroke-width="2"/>
  <text x="660" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c2a26">A native speaker reading it sees</text>

  <rect x="510" y="150" width="300" height="46" rx="6" fill="#b5482f"/>
  <text x="660" y="178" text-anchor="middle" font-size="12" fill="#f3f0ea">wrong Hebrew transliteration of "South Tarawa"</text>

  <rect x="510" y="210" width="300" height="46" rx="6" fill="#b5482f"/>
  <text x="660" y="238" text-anchor="middle" font-size="12" fill="#f3f0ea">a hyphenation break mid-word, jarring aloud</text>

  <rect x="510" y="270" width="300" height="46" rx="6" fill="#b5482f"/>
  <text x="660" y="298" text-anchor="middle" font-size="12" fill="#f3f0ea">tone doesn't match the entry three rows up</text>

  <rect x="510" y="340" width="300" height="80" rx="8" fill="#2c2a26"/>
  <text x="660" y="368" text-anchor="middle" font-size="13" fill="#f3f0ea" font-weight="bold">Verdict: quietly wrong</text>
  <text x="660" y="390" text-anchor="middle" font-size="11" fill="#f3f0ea">present, valid, and incorrect</text>

  <text x="450" y="500" text-anchor="middle" font-size="13" fill="#2c2a26" font-weight="bold">"Present" and "correct" are different claims</text>
</svg>
