<svg viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="550" fill="#f3f0ea"/>
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c2a26">Exploratory Testing Flow</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#71685a">reading the product as its actual audience would</text>

  <g font-size="13" fill="#f3f0ea">
    <rect x="370" y="100" width="160" height="55" rx="10" fill="#2c2a26"/>
    <text x="450" y="132" text-anchor="middle" font-weight="bold">Play it like the user</text>
  </g>

  <line x1="450" y1="155" x2="450" y2="195" stroke="#2c2a26" stroke-width="2" marker-end="url(#a5)"/>

  <rect x="330" y="195" width="240" height="60" rx="10" fill="#3f6f5e"/>
  <text x="450" y="220" text-anchor="middle" font-size="13" fill="#f3f0ea" font-weight="bold">Something feels slightly off</text>
  <text x="450" y="240" text-anchor="middle" font-size="11" fill="#f3f0ea">before you can explain why</text>

  <line x1="450" y1="255" x2="450" y2="295" stroke="#2c2a26" stroke-width="2" marker-end="url(#a5)"/>

  <rect x="300" y="295" width="300" height="60" rx="10" fill="#b5482f"/>
  <text x="450" y="320" text-anchor="middle" font-size="13" fill="#f3f0ea" font-weight="bold">Stop and investigate that instinct</text>
  <text x="450" y="340" text-anchor="middle" font-size="11" fill="#f3f0ea">look it up, read it aloud, compare tone</text>

  <line x1="450" y1="355" x2="220" y2="410" stroke="#2c2a26" stroke-width="2" marker-end="url(#a5)"/>
  <line x1="450" y1="355" x2="680" y2="410" stroke="#2c2a26" stroke-width="2" marker-end="url(#a5)"/>

  <rect x="90" y="410" width="260" height="70" rx="10" fill="#e4ddce" stroke="#8a7d63" stroke-width="1.5"/>
  <text x="220" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c2a26">Confirmed real bug</text>
  <text x="220" y="458" text-anchor="middle" font-size="11" fill="#2c2a26">fix it, note the pattern</text>

  <rect x="550" y="410" width="260" height="70" rx="10" fill="#e4ddce" stroke="#8a7d63" stroke-width="1.5"/>
  <text x="680" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c2a26">False alarm</text>
  <text x="680" y="458" text-anchor="middle" font-size="11" fill="#2c2a26">still worth the two minutes</text>

  <defs>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2c2a26"/>
    </marker>
  </defs>
</svg>
