<svg viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="550" fill="#f5f1e9"/>
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#33302a">Skills That Transfer</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#71685a">the same discipline, three different rooms</text>

  <!-- three columns -->
  <g font-size="13" fill="#33302a">
    <rect x="60" y="110" width="240" height="60" rx="10" fill="#2f5673"/>
    <text x="180" y="135" text-anchor="middle" fill="#f5f1e9" font-weight="bold">QA at work</text>
    <text x="180" y="155" text-anchor="middle" fill="#f5f1e9" font-size="11">re-validate every batch</text>

    <rect x="330" y="110" width="240" height="60" rx="10" fill="#b5482f"/>
    <text x="450" y="135" text-anchor="middle" fill="#f5f1e9" font-weight="bold">geo-kids side project</text>
    <text x="450" y="155" text-anchor="middle" fill="#f5f1e9" font-size="11">re-check every continent added</text>

    <rect x="600" y="110" width="240" height="60" rx="10" fill="#3f6f5e"/>
    <text x="720" y="135" text-anchor="middle" fill="#f5f1e9" font-weight="bold">Parenting</text>
    <text x="720" y="155" text-anchor="middle" fill="#f5f1e9" font-size="11">explain the fifth time, same as first</text>
  </g>

  <!-- convergence lines to shared center -->
  <line x1="180" y1="170" x2="450" y2="260" stroke="#71685a" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="450" y1="170" x2="450" y2="260" stroke="#71685a" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="720" y1="170" x2="450" y2="260" stroke="#71685a" stroke-width="2" stroke-dasharray="4,3"/>

  <rect x="290" y="260" width="320" height="90" rx="12" fill="#33302a"/>
  <text x="450" y="292" text-anchor="middle" font-size="14" fill="#f5f1e9" font-weight="bold">Patience + checking assumptions</text>
  <text x="450" y="315" text-anchor="middle" font-size="12" fill="#f5f1e9">the same well, refilled nightly</text>
  <text x="450" y="335" text-anchor="middle" font-size="12" fill="#f5f1e9">by a junior engineer or a six-year-old</text>

  <rect x="180" y="400" width="540" height="80" rx="10" fill="#e4ede8" stroke="#3f6f5e" stroke-width="1.5"/>
  <text x="450" y="430" text-anchor="middle" font-size="13" fill="#33302a" font-weight="bold">Staying hands-on kept the manager honest</text>
  <text x="450" y="452" text-anchor="middle" font-size="12" fill="#33302a">fresh, specific memory of where the tedious parts of quality live</text>
</svg>
