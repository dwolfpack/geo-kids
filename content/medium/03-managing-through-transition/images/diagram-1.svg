<svg viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="550" fill="#f6f1ec"/>
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a2e2c">Two Speeds of Change</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#7a675f">process changes in a meeting; trust changes with repetition</text>

  <!-- process line: fast, single jump -->
  <text x="90" y="130" font-size="13" fill="#3a2e2c" font-weight="bold">Process</text>
  <line x1="90" y1="150" x2="820" y2="150" stroke="#8a6b52" stroke-width="2"/>
  <circle cx="150" cy="150" r="8" fill="#8a6b52"/>
  <line x1="150" y1="150" x2="300" y2="150" stroke="#b5482f" stroke-width="4"/>
  <circle cx="300" cy="150" r="10" fill="#b5482f"/>
  <text x="300" y="130" text-anchor="middle" font-size="12" fill="#b5482f" font-weight="bold">announcement</text>
  <text x="560" y="150" text-anchor="middle" font-size="12" fill="#7a675f">new structure is "official" instantly</text>

  <!-- trust line: slow staircase -->
  <text x="90" y="230" font-size="13" fill="#3a2e2c" font-weight="bold">Trust / habit</text>
  <polyline points="90,320 180,315 260,300 340,290 420,270 500,255 580,235 660,220 740,205 820,195"
    fill="none" stroke="#3f6f5e" stroke-width="4"/>
  <g fill="#3f6f5e">
    <circle cx="180" cy="315" r="5"/>
    <circle cx="260" cy="300" r="5"/>
    <circle cx="340" cy="290" r="5"/>
    <circle cx="420" cy="270" r="5"/>
    <circle cx="500" cy="255" r="5"/>
    <circle cx="580" cy="235" r="5"/>
    <circle cx="660" cy="220" r="5"/>
    <circle cx="740" cy="205" r="5"/>
  </g>
  <text x="500" y="345" text-anchor="middle" font-size="12" fill="#7a675f">each step = one real bug routed correctly, once, by hand</text>

  <!-- gap highlight -->
  <rect x="280" y="180" width="260" height="90" rx="10" fill="none" stroke="#b5482f" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="410" y="410" text-anchor="middle" font-size="13" fill="#b5482f" font-weight="bold">The gap is where trust erodes</text>
  <text x="410" y="432" text-anchor="middle" font-size="12" fill="#7a675f">the diagram was clear; the habit hadn't changed yet</text>

  <rect x="150" y="460" width="600" height="60" rx="10" fill="#e9dfd2" stroke="#3a2e2c" stroke-width="1.5"/>
  <text x="450" y="495" text-anchor="middle" font-size="13" fill="#3a2e2c" font-weight="bold">Repetition beats explanation when you're asking people to change a habit</text>
</svg>
