<svg viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="550" fill="#f6f1ec"/>
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a2e2c">What Actually Earns Trust</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#7a675f">a simple flow through a hard transition</text>

  <!-- flowchart nodes -->
  <g font-size="13" fill="#f6f1ec">
    <rect x="360" y="100" width="180" height="55" rx="10" fill="#3a2e2c"/>
    <text x="450" y="132" text-anchor="middle" font-weight="bold">Hard change announced</text>
  </g>
  <line x1="450" y1="155" x2="450" y2="190" stroke="#3a2e2c" stroke-width="2" marker-end="url(#a4)"/>

  <g font-size="12" fill="#3a2e2c">
    <rect x="150" y="190" width="220" height="60" rx="10" fill="#e9dfd2" stroke="#8a6b52" stroke-width="1.5"/>
    <text x="260" y="215" text-anchor="middle" font-weight="bold">Say what's uncertain</text>
    <text x="260" y="233" text-anchor="middle" font-size="11">out loud, without false comfort</text>

    <rect x="530" y="190" width="220" height="60" rx="10" fill="#e9dfd2" stroke="#8a6b52" stroke-width="1.5"/>
    <text x="640" y="215" text-anchor="middle" font-weight="bold">Let people push back</text>
    <text x="640" y="233" text-anchor="middle" font-size="11">chutzpah = signal, not threat</text>
  </g>
  <line x1="450" y1="155" x2="260" y2="188" stroke="#3a2e2c" stroke-width="2" marker-end="url(#a4)"/>
  <line x1="450" y1="155" x2="640" y2="188" stroke="#3a2e2c" stroke-width="2" marker-end="url(#a4)"/>

  <line x1="260" y1="250" x2="450" y2="300" stroke="#3a2e2c" stroke-width="2" marker-end="url(#a4)"/>
  <line x1="640" y1="250" x2="450" y2="300" stroke="#3a2e2c" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="330" y="300" width="240" height="60" rx="10" fill="#3f6f5e"/>
  <text x="450" y="325" text-anchor="middle" font-size="13" fill="#f6f1ec" font-weight="bold">Repeat until it's habit</text>
  <text x="450" y="343" text-anchor="middle" font-size="11" fill="#f6f1ec">not a one-time memo</text>

  <line x1="450" y1="360" x2="450" y2="400" stroke="#3a2e2c" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="270" y="400" width="360" height="70" rx="10" fill="#b5482f"/>
  <text x="450" y="428" text-anchor="middle" font-size="14" fill="#f6f1ec" font-weight="bold">Team's trust survives the change</text>
  <text x="450" y="450" text-anchor="middle" font-size="11" fill="#f6f1ec">the actual measure of managing it well</text>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3a2e2c"/>
    </marker>
  </defs>
</svg>
