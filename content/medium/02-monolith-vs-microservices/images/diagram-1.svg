<svg viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="550" fill="#f5f2ec"/>
  <text x="225" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#22303a">Monolith</text>
  <text x="675" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#22303a">Microservices</text>

  <!-- monolith box -->
  <rect x="70" y="70" width="310" height="330" rx="14" fill="#2f5673" stroke="#22303a" stroke-width="2"/>
  <g fill="#f5f2ec" font-size="13">
    <rect x="100" y="100" width="110" height="50" rx="6" fill="#3f6f8f"/>
    <text x="155" y="130" text-anchor="middle">Checkout</text>
    <rect x="240" y="100" width="110" height="50" rx="6" fill="#3f6f8f"/>
    <text x="295" y="130" text-anchor="middle">Billing</text>
    <rect x="100" y="170" width="110" height="50" rx="6" fill="#3f6f8f"/>
    <text x="155" y="200" text-anchor="middle">Inventory</text>
    <rect x="240" y="170" width="110" height="50" rx="6" fill="#3f6f8f"/>
    <text x="295" y="200" text-anchor="middle">Notify</text>
    <rect x="100" y="240" width="250" height="50" rx="6" fill="#1c3a4f"/>
    <text x="225" y="270" text-anchor="middle">shared database</text>
  </g>
  <rect x="90" y="320" width="270" height="60" rx="8" fill="#c65d3b"/>
  <text x="225" y="345" text-anchor="middle" font-size="12" fill="#f5f2ec" font-weight="bold">Failure mode: total, obvious</text>
  <text x="225" y="364" text-anchor="middle" font-size="11" fill="#f5f2ec">one deploy, blast radius = everything</text>

  <!-- microservices box -->
  <g font-size="12" fill="#f5f2ec">
    <rect x="480" y="80" width="100" height="50" rx="8" fill="#3f6f8f" stroke="#22303a" stroke-width="1.5"/>
    <text x="530" y="110" text-anchor="middle">Checkout</text>

    <rect x="620" y="80" width="100" height="50" rx="8" fill="#3f6f8f" stroke="#22303a" stroke-width="1.5"/>
    <text x="670" y="110" text-anchor="middle">Payments</text>

    <rect x="760" y="80" width="100" height="50" rx="8" fill="#3f6f8f" stroke="#22303a" stroke-width="1.5"/>
    <text x="810" y="110" text-anchor="middle">Inventory</text>

    <rect x="550" y="190" width="100" height="50" rx="8" fill="#3f6f8f" stroke="#22303a" stroke-width="1.5"/>
    <text x="600" y="220" text-anchor="middle">Billing</text>

    <rect x="690" y="190" width="100" height="50" rx="8" fill="#3f6f8f" stroke="#22303a" stroke-width="1.5"/>
    <text x="740" y="220" text-anchor="middle">Notify</text>
  </g>

  <!-- seams, marked as danger zone -->
  <g stroke="#c65d3b" stroke-width="3" stroke-dasharray="6,4">
    <line x1="580" y1="115" x2="620" y2="115"/>
    <line x1="720" y1="115" x2="760" y2="115"/>
    <line x1="600" y1="130" x2="600" y2="190"/>
    <line x1="670" y1="130" x2="740" y2="190"/>
    <line x1="700" y1="215" x2="690" y2="215"/>
  </g>
  <text x="670" y="270" text-anchor="middle" font-size="12" fill="#c65d3b" font-weight="bold">dashed lines = the seams</text>

  <rect x="500" y="320" width="330" height="70" rx="8" fill="#c65d3b"/>
  <text x="665" y="345" text-anchor="middle" font-size="12" fill="#f5f2ec" font-weight="bold">Failure mode: specific, hidden</text>
  <text x="665" y="364" text-anchor="middle" font-size="11" fill="#f5f2ec">every service green, the seam still breaks</text>
  <text x="665" y="380" text-anchor="middle" font-size="11" fill="#f5f2ec">"it works on my service" syndrome</text>

  <!-- bottom shared caption -->
  <rect x="150" y="430" width="600" height="80" rx="10" fill="#e7e0d3" stroke="#22303a" stroke-width="1.5"/>
  <text x="450" y="458" text-anchor="middle" font-size="13" fill="#22303a" font-weight="bold">Risk doesn't disappear when a system splits</text>
  <text x="450" y="480" text-anchor="middle" font-size="12" fill="#22303a">it moves from being everyone's problem to being nobody's, unless assigned</text>

</svg>
