<svg viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="550" fill="#f5f2ec"/>
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#22303a">A Request Crossing Three Seams</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#5b6b74">where contract testing earns its keep</text>

  <!-- chain of services -->
  <g font-size="13" fill="#f5f2ec">
    <rect x="60" y="130" width="150" height="60" rx="10" fill="#3f6f8f" stroke="#22303a" stroke-width="2"/>
    <text x="135" y="165" text-anchor="middle" font-weight="bold">Checkout</text>

    <rect x="290" y="130" width="150" height="60" rx="10" fill="#3f6f8f" stroke="#22303a" stroke-width="2"/>
    <text x="365" y="165" text-anchor="middle" font-weight="bold">Inventory</text>

    <rect x="520" y="130" width="150" height="60" rx="10" fill="#3f6f8f" stroke="#22303a" stroke-width="2"/>
    <text x="595" y="165" text-anchor="middle" font-weight="bold">Payments</text>

    <rect x="750" y="130" width="120" height="60" rx="10" fill="#3f6f8f" stroke="#22303a" stroke-width="2"/>
    <text x="810" y="165" text-anchor="middle" font-weight="bold">Notify</text>
  </g>

  <g stroke="#22303a" stroke-width="2" marker-end="url(#a3)">
    <line x1="210" y1="160" x2="288" y2="160"/>
    <line x1="440" y1="160" x2="518" y2="160"/>
    <line x1="670" y1="160" x2="748" y2="160"/>
  </g>

  <!-- contract labels on seams -->
  <g font-size="11" fill="#c65d3b" font-weight="bold">
    <text x="249" y="145" text-anchor="middle">contract A</text>
    <text x="479" y="145" text-anchor="middle">contract B</text>
    <text x="709" y="145" text-anchor="middle">contract C</text>
  </g>

  <!-- broken seam highlight -->
  <circle cx="479" cy="160" r="26" fill="none" stroke="#c65d3b" stroke-width="3" stroke-dasharray="4,3"/>
  <text x="479" y="230" text-anchor="middle" font-size="12" fill="#c65d3b" font-weight="bold">schema mismatch here</text>
  <text x="479" y="248" text-anchor="middle" font-size="11" fill="#5b6b74">Inventory sends a field Payments no longer expects</text>

  <!-- each team's view -->
  <g font-size="12" fill="#22303a">
    <rect x="60" y="300" width="200" height="70" rx="8" fill="#e7e0d3" stroke="#3f6f8f" stroke-width="1.5"/>
    <text x="160" y="325" text-anchor="middle" font-weight="bold">Checkout team says</text>
    <text x="160" y="345" text-anchor="middle">"our service is green"</text>
    <text x="160" y="360" text-anchor="middle" font-size="10">(true)</text>

    <rect x="350" y="300" width="200" height="70" rx="8" fill="#e7e0d3" stroke="#3f6f8f" stroke-width="1.5"/>
    <text x="450" y="325" text-anchor="middle" font-weight="bold">Inventory team says</text>
    <text x="450" y="345" text-anchor="middle">"our service is green"</text>
    <text x="450" y="360" text-anchor="middle" font-size="10">(true)</text>

    <rect x="640" y="300" width="200" height="70" rx="8" fill="#e7e0d3" stroke="#3f6f8f" stroke-width="1.5"/>
    <text x="740" y="325" text-anchor="middle" font-weight="bold">Payments team says</text>
    <text x="740" y="345" text-anchor="middle">"our service is green"</text>
    <text x="740" y="360" text-anchor="middle" font-size="10">(true)</text>
  </g>

  <rect x="180" y="420" width="540" height="80" rx="10" fill="#c65d3b"/>
  <text x="450" y="450" text-anchor="middle" font-size="14" fill="#f5f2ec" font-weight="bold">And the system is still broken</text>
  <text x="450" y="472" text-anchor="middle" font-size="12" fill="#f5f2ec">the bug lived in the seam, which belonged to no single team's tests</text>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22303a"/>
    </marker>
  </defs>
</svg>
