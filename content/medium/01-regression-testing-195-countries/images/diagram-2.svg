<svg viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="550" fill="#f7f3ea"/>
  <text x="450" y="46" text-anchor="middle" font-size="24" fill="#2b2620" font-weight="bold">Batch Validation, Continent by Continent</text>
  <text x="450" y="70" text-anchor="middle" font-size="14" fill="#6b5f4d">re-validate after every batch, not once at the end</text>

  <!-- flow of batches -->
  <g font-size="13" fill="#2b2620">
    <rect x="50" y="120" width="140" height="60" rx="10" fill="#3f6f5e" stroke="#2b2620" stroke-width="2"/>
    <text x="120" y="145" text-anchor="middle" fill="#f7f3ea" font-weight="bold">Africa</text>
    <text x="120" y="163" text-anchor="middle" fill="#f7f3ea" font-size="11">batch added</text>

    <rect x="230" y="120" width="140" height="60" rx="10" fill="#e8ddc8" stroke="#2b2620" stroke-width="2"/>
    <text x="300" y="145" text-anchor="middle" font-weight="bold">validate</text>
    <text x="300" y="163" text-anchor="middle" font-size="11">script + read-aloud</text>

    <rect x="410" y="120" width="140" height="60" rx="10" fill="#3f6f5e" stroke="#2b2620" stroke-width="2"/>
    <text x="480" y="145" text-anchor="middle" fill="#f7f3ea" font-weight="bold">Oceania</text>
    <text x="480" y="163" text-anchor="middle" fill="#f7f3ea" font-size="11">batch added</text>

    <rect x="590" y="120" width="140" height="60" rx="10" fill="#e8ddc8" stroke="#2b2620" stroke-width="2"/>
    <text x="660" y="145" text-anchor="middle" font-weight="bold">validate</text>
    <text x="660" y="163" text-anchor="middle" font-size="11">script + read-aloud</text>

    <rect x="770" y="120" width="90" height="60" rx="10" fill="#3f6f5e" stroke="#2b2620" stroke-width="2"/>
    <text x="815" y="150" text-anchor="middle" fill="#f7f3ea" font-size="12" font-weight="bold">...more</text>
  </g>
  <g stroke="#8a7a5c" stroke-width="2" marker-end="url(#arrow2)">
    <line x1="190" y1="150" x2="228" y2="150"/>
    <line x1="370" y1="150" x2="408" y2="150"/>
    <line x1="550" y1="150" x2="588" y2="150"/>
    <line x1="730" y1="150" x2="768" y2="150"/>
  </g>

  <!-- two check items -->
  <rect x="120" y="240" width="300" height="90" rx="10" fill="#f0e6d2" stroke="#c65d3b" stroke-width="2"/>
  <text x="270" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2620">validate-countries-data.js</text>
  <text x="270" y="290" text-anchor="middle" font-size="12" fill="#2b2620">schema completeness</text>
  <text x="270" y="308" text-anchor="middle" font-size="12" fill="#2b2620">unique country codes</text>

  <rect x="480" y="240" width="300" height="90" rx="10" fill="#f0e6d2" stroke="#c65d3b" stroke-width="2"/>
  <text x="630" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2620">--levels cross-check</text>
  <text x="630" y="290" text-anchor="middle" font-size="12" fill="#2b2620">LEVELS in index.html</text>
  <text x="630" y="308" text-anchor="middle" font-size="12" fill="#2b2620">vs. actual country data</text>

  <!-- bug found here box -->
  <rect x="200" y="380" width="500" height="110" rx="10" fill="#c65d3b" stroke="#2b2620" stroke-width="2"/>
  <text x="450" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#f7f3ea">Caught by the human eye, not the script</text>
  <text x="450" y="432" text-anchor="middle" font-size="12" fill="#f7f3ea">missing Albania · Hebrew hyphenation bug</text>
  <text x="450" y="452" text-anchor="middle" font-size="12" fill="#f7f3ea">wrong Hebrew capital names: Kiribati, Seychelles</text>
  <text x="450" y="472" text-anchor="middle" font-size="12" fill="#f7f3ea">wrong Hebrew name near Bamako / C.A.R.</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8a7a5c"/>
    </marker>
  </defs>
</svg>
