<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="500" fill="#f7f4ee"/>
  <text x="400" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2a37">Where the Risk Moves</text>

  <!-- Monolith -->
  <text x="185" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#2f6f5e">Monolith</text>
  <rect x="60" y="105" width="250" height="280" rx="12" fill="#e8f3ee" stroke="#2f6f5e" stroke-width="2.5"/>
  <rect x="85" y="130" width="200" height="45" rx="6" fill="#ffffff" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="185" y="157" text-anchor="middle" font-size="13" fill="#1f2a37">checkout flow</text>
  <rect x="85" y="185" width="200" height="45" rx="6" fill="#ffffff" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="185" y="212" text-anchor="middle" font-size="13" fill="#1f2a37">payments</text>
  <rect x="85" y="240" width="200" height="45" rx="6" fill="#ffffff" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="185" y="267" text-anchor="middle" font-size="13" fill="#1f2a37">inventory</text>
  <text x="185" y="315" text-anchor="middle" font-size="12" fill="#2f6f5e">one deploy,</text>
  <text x="185" y="333" text-anchor="middle" font-size="12" fill="#2f6f5e">one stack trace,</text>
  <text x="185" y="351" text-anchor="middle" font-size="12" fill="#2f6f5e">one owner</text>

  <!-- Microservices -->
  <text x="615" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#b5533c">Microservices</text>
  <rect x="470" y="120" width="130" height="60" rx="8" fill="#ffffff" stroke="#b5533c" stroke-width="2"/>
  <text x="535" y="155" text-anchor="middle" font-size="13" fill="#1f2a37">Service A</text>
  <rect x="620" y="120" width="130" height="60" rx="8" fill="#ffffff" stroke="#b5533c" stroke-width="2"/>
  <text x="685" y="155" text-anchor="middle" font-size="13" fill="#1f2a37">Service B</text>
  <rect x="545" y="230" width="130" height="60" rx="8" fill="#ffffff" stroke="#b5533c" stroke-width="2"/>
  <text x="610" y="265" text-anchor="middle" font-size="13" fill="#1f2a37">Service C</text>

  <line x1="600" y1="150" x2="620" y2="150" stroke="#b5533c" stroke-width="2"/>
  <line x1="535" y1="180" x2="580" y2="230" stroke="#b5533c" stroke-width="3" stroke-dasharray="3 5"/>
  <line x1="685" y1="180" x2="640" y2="230" stroke="#b5533c" stroke-width="3" stroke-dasharray="3 5"/>

  <circle cx="600" cy="150" r="6" fill="#c9a227"/>
  <circle cx="608" cy="205" r="6" fill="#c9a227"/>

  <rect x="460" y="330" width="290" height="60" rx="8" fill="#f0ece1" stroke="#c9a227" stroke-width="2"/>
  <text x="605" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#7a6423">each service: all green</text>
  <text x="605" y="375" text-anchor="middle" font-size="12" fill="#7a6423">the seam between them: untested</text>

  <text x="400" y="440" text-anchor="middle" font-size="13" fill="#5b6b73">Risk moves from inside the code to the handshakes between teams.</text>
</svg>
