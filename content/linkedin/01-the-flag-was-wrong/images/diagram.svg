<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="500" fill="#f7f4ee"/>
  <text x="400" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2a37">Code Correct. Meaning Wrong.</text>

  <!-- left: correct pipeline -->
  <g>
    <rect x="60" y="110" width="300" height="70" rx="10" fill="#ffffff" stroke="#2f6f5e" stroke-width="2"/>
    <text x="210" y="140" text-anchor="middle" font-size="16" fill="#1f2a37">code: "TV"</text>
    <text x="210" y="162" text-anchor="middle" font-size="13" fill="#5b6b73">(intended: Tuvalu)</text>

    <path d="M210 180 L210 220" stroke="#2f6f5e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="60" y="220" width="300" height="70" rx="10" fill="#ffffff" stroke="#2f6f5e" stroke-width="2"/>
    <text x="210" y="250" text-anchor="middle" font-size="14" fill="#1f2a37">flagcdn.com/w320/tv.png</text>
    <text x="210" y="272" text-anchor="middle" font-size="13" fill="#5b6b73">request succeeds, 200 OK</text>

    <path d="M210 290 L210 330" stroke="#2f6f5e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="60" y="330" width="300" height="80" rx="10" fill="#e8f3ee" stroke="#2f6f5e" stroke-width="2"/>
    <text x="210" y="362" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2a37">Tuvalu's flag renders</text>
    <text x="210" y="386" text-anchor="middle" font-size="13" fill="#2f6f5e">but labeled "Kiribati"</text>
  </g>

  <!-- right: what caught it -->
  <g>
    <rect x="440" y="110" width="300" height="70" rx="10" fill="#ffffff" stroke="#b5533c" stroke-width="2"/>
    <text x="590" y="140" text-anchor="middle" font-size="16" fill="#1f2a37">Automated check</text>
    <text x="590" y="162" text-anchor="middle" font-size="13" fill="#5b6b73">schema valid, code unique</text>

    <path d="M590 180 L590 220" stroke="#b5533c" stroke-width="2" marker-end="url(#arrowRed)"/>

    <rect x="440" y="220" width="300" height="70" rx="10" fill="#fbeee9" stroke="#b5533c" stroke-width="2"/>
    <text x="590" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#b5533c">PASS</text>
    <text x="590" y="274" text-anchor="middle" font-size="13" fill="#5b6b73">no assertion for "right country"</text>

    <path d="M590 290 L590 330" stroke="#8a8f98" stroke-width="2" stroke-dasharray="4 4"/>

    <rect x="440" y="330" width="300" height="80" rx="10" fill="#f0ece1" stroke="#c9a227" stroke-width="2"/>
    <text x="590" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2a37">6-year-old looks at it</text>
    <text x="590" y="384" text-anchor="middle" font-size="13" fill="#7a6423">"that's not right"</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2f6f5e"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b5533c"/>
    </marker>
  </defs>

  <text x="400" y="465" text-anchor="middle" font-size="13" fill="#5b6b73">No error. No crash. Just wrong — and only a human noticed.</text>
</svg>
