<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="500" fill="#f7f4ee"/>
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2a37">One Continent at a Time</text>

  <!-- flow -->
  <g font-size="13">
    <rect x="40" y="80" width="130" height="55" rx="8" fill="#ffffff" stroke="#2f6f5e" stroke-width="2"/>
    <text x="105" y="112" text-anchor="middle" fill="#1f2a37">plan batch</text>
    <text x="105" y="128" text-anchor="middle" font-size="10" fill="#5b6b73">e.g. Africa</text>

    <path d="M170 107 L210 107" stroke="#2f6f5e" stroke-width="2" marker-end="url(#a4)"/>

    <rect x="210" y="80" width="130" height="55" rx="8" fill="#ffffff" stroke="#2f6f5e" stroke-width="2"/>
    <text x="275" y="112" text-anchor="middle" fill="#1f2a37">author data</text>
    <text x="275" y="128" text-anchor="middle" font-size="10" fill="#5b6b73">he + en fields</text>

    <path d="M340 107 L380 107" stroke="#2f6f5e" stroke-width="2" marker-end="url(#a4)"/>

    <rect x="380" y="80" width="150" height="55" rx="8" fill="#ffffff" stroke="#2f6f5e" stroke-width="2"/>
    <text x="455" y="105" text-anchor="middle" fill="#1f2a37">run validate-</text>
    <text x="455" y="122" text-anchor="middle" fill="#1f2a37">countries-data.js</text>

    <path d="M530 107 L570 107" stroke="#2f6f5e" stroke-width="2" marker-end="url(#a4)"/>

    <rect x="570" y="80" width="180" height="55" rx="8" fill="#e8f3ee" stroke="#2f6f5e" stroke-width="2"/>
    <text x="660" y="105" text-anchor="middle" fill="#1f2a37">fix flagged issues,</text>
    <text x="660" y="122" text-anchor="middle" fill="#1f2a37">re-validate</text>
  </g>

  <!-- loop back arrow -->
  <path d="M660 135 C 660 200, 105 200, 105 135" fill="none" stroke="#c9a227" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a5)"/>
  <text x="380" y="220" text-anchor="middle" font-size="13" fill="#7a6423">next continent, only once this batch is clean</text>

  <!-- validation script detail box -->
  <rect x="150" y="270" width="500" height="150" rx="10" fill="#ffffff" stroke="#5b6b73" stroke-width="1.5"/>
  <text x="400" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2a37">validate-countries-data.js</text>
  <text x="400" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2a37" dy="0"> </text>
  <text x="180" y="330" font-size="12" fill="#2f6f5e">✓ schema completeness per entry</text>
  <text x="180" y="356" font-size="12" fill="#2f6f5e">✓ unique country codes</text>
  <text x="180" y="382" font-size="12" fill="#2f6f5e">✓ --levels: LEVELS in index.html match country data</text>
  <text x="180" y="405" font-size="11" fill="#5b6b73">dependency-free: fs, path, vm only</text>

  <defs>
    <marker id="a4" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2f6f5e"/></marker>
    <marker id="a5" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c9a227"/></marker>
  </defs>

  <text x="400" y="465" text-anchor="middle" font-size="13" fill="#5b6b73">Batch size is a QA decision as much as a delivery one.</text>
</svg>
