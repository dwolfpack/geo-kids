<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="500" fill="#f7f4ee"/>
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2a37">Re-tiering: Population vs. Recognizability</text>

  <!-- BEFORE chart -->
  <text x="200" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#b5533c">Before — by population</text>
  <g>
    <rect x="90" y="90" width="45" height="180" fill="#fbeee9" stroke="#b5533c" stroke-width="1.5"/>
    <text x="112" y="278" text-anchor="middle" font-size="12" fill="#5b6b73">L1</text>
    <text x="112" y="85" text-anchor="middle" font-size="11" fill="#b5533c">30</text>

    <rect x="150" y="90" width="45" height="180" fill="#fbeee9" stroke="#b5533c" stroke-width="1.5"/>
    <text x="172" y="278" text-anchor="middle" font-size="12" fill="#5b6b73">L2</text>
    <text x="172" y="85" text-anchor="middle" font-size="11" fill="#b5533c">30</text>

    <rect x="210" y="90" width="45" height="180" fill="#fbeee9" stroke="#b5533c" stroke-width="1.5"/>
    <text x="232" y="278" text-anchor="middle" font-size="12" fill="#5b6b73">L3</text>
    <text x="232" y="85" text-anchor="middle" font-size="11" fill="#b5533c">30</text>

    <rect x="270" y="240" width="45" height="30" fill="#fbeee9" stroke="#b5533c" stroke-width="1.5"/>
    <text x="292" y="278" text-anchor="middle" font-size="12" fill="#5b6b73">L4</text>
    <text x="292" y="235" text-anchor="middle" font-size="11" fill="#b5533c">5</text>

    <rect x="330" y="240" width="45" height="30" fill="#fbeee9" stroke="#b5533c" stroke-width="1.5"/>
    <text x="352" y="278" text-anchor="middle" font-size="12" fill="#5b6b73">L5</text>
    <text x="352" y="235" text-anchor="middle" font-size="11" fill="#b5533c">5</text>
  </g>
  <line x1="80" y1="280" x2="390" y2="280" stroke="#8a8f98" stroke-width="1.5"/>

  <!-- AFTER chart -->
  <text x="600" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#2f6f5e">After — by recognizability</text>
  <g>
    <rect x="450" y="120" width="45" height="150" fill="#e8f3ee" stroke="#2f6f5e" stroke-width="1.5"/>
    <text x="472" y="278" text-anchor="middle" font-size="12" fill="#5b6b73">L1</text>
    <text x="472" y="115" text-anchor="middle" font-size="11" fill="#2f6f5e">39</text>

    <rect x="510" y="120" width="45" height="150" fill="#e8f3ee" stroke="#2f6f5e" stroke-width="1.5"/>
    <text x="532" y="278" text-anchor="middle" font-size="12" fill="#5b6b73">L2</text>
    <text x="532" y="115" text-anchor="middle" font-size="11" fill="#2f6f5e">39</text>

    <rect x="570" y="120" width="45" height="150" fill="#e8f3ee" stroke="#2f6f5e" stroke-width="1.5"/>
    <text x="592" y="278" text-anchor="middle" font-size="12" fill="#5b6b73">L3</text>
    <text x="592" y="115" text-anchor="middle" font-size="11" fill="#2f6f5e">39</text>

    <rect x="630" y="120" width="45" height="150" fill="#e8f3ee" stroke="#2f6f5e" stroke-width="1.5"/>
    <text x="652" y="278" text-anchor="middle" font-size="12" fill="#5b6b73">L4</text>
    <text x="652" y="115" text-anchor="middle" font-size="11" fill="#2f6f5e">39</text>

    <rect x="690" y="122" width="45" height="148" fill="#e8f3ee" stroke="#2f6f5e" stroke-width="1.5"/>
    <text x="712" y="278" text-anchor="middle" font-size="12" fill="#5b6b73">L5</text>
    <text x="712" y="117" text-anchor="middle" font-size="11" fill="#2f6f5e">38</text>
  </g>
  <line x1="440" y1="280" x2="750" y2="280" stroke="#8a8f98" stroke-width="1.5"/>

  <path d="M395 180 L440 180" stroke="#c9a227" stroke-width="2.5" marker-end="url(#a3)"/>
  <defs>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c9a227"/></marker>
  </defs>

  <text x="400" y="340" text-anchor="middle" font-size="13" fill="#5b6b73">Big/small population split → even tiers by "has a 7-year-old heard of this?"</text>
  <text x="400" y="365" text-anchor="middle" font-size="12" fill="#5b6b73">Japan: small population rank, instantly recognized. Bangladesh: huge population, unknown to a kid.</text>
</svg>
