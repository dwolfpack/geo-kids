<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="500" fill="#f7f4ee"/>
  <text x="400" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2a37">Two Rooms, Same Instinct</text>

  <!-- divider -->
  <line x1="400" y1="80" x2="400" y2="420" stroke="#8a8f98" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- left: home -->
  <text x="200" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#2f6f5e">At home</text>
  <circle cx="200" cy="150" r="34" fill="#e8f3ee" stroke="#2f6f5e" stroke-width="2"/>
  <text x="200" y="156" text-anchor="middle" font-size="24">🧒</text>
  <text x="200" y="205" text-anchor="middle" font-size="12" fill="#1f2a37">stuck on the country picker</text>

  <path d="M200 220 L200 255" stroke="#8a8f98" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="90" y="255" width="220" height="55" rx="8" fill="#fbeee9" stroke="#b5533c" stroke-width="2"/>
  <text x="200" y="278" text-anchor="middle" font-size="12" fill="#b5533c">explain again, louder</text>
  <text x="200" y="296" text-anchor="middle" font-size="11" fill="#5b6b73">(what I used to do)</text>

  <path d="M200 310 L200 340" stroke="#2f6f5e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a2)"/>

  <rect x="90" y="340" width="220" height="55" rx="8" fill="#e8f3ee" stroke="#2f6f5e" stroke-width="2"/>
  <text x="200" y="363" text-anchor="middle" font-size="12" fill="#2f6f5e">go quiet, let her click around</text>
  <text x="200" y="381" text-anchor="middle" font-size="11" fill="#2f6f5e">she finds it in 20 seconds</text>

  <!-- right: work -->
  <text x="600" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#2f6f5e">At work</text>
  <circle cx="600" cy="150" r="34" fill="#e8f3ee" stroke="#2f6f5e" stroke-width="2"/>
  <text x="600" y="156" text-anchor="middle" font-size="24">💻</text>
  <text x="600" y="205" text-anchor="middle" font-size="12" fill="#1f2a37">stuck on a failing test</text>

  <path d="M600 220 L600 255" stroke="#8a8f98" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="490" y="255" width="220" height="55" rx="8" fill="#fbeee9" stroke="#b5533c" stroke-width="2"/>
  <text x="600" y="278" text-anchor="middle" font-size="12" fill="#b5533c">just fix it for them</text>
  <text x="600" y="296" text-anchor="middle" font-size="11" fill="#5b6b73">(the easy shortcut)</text>

  <path d="M600 310 L600 340" stroke="#2f6f5e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a2)"/>

  <rect x="490" y="340" width="220" height="55" rx="8" fill="#e8f3ee" stroke="#2f6f5e" stroke-width="2"/>
  <text x="600" y="363" text-anchor="middle" font-size="12" fill="#2f6f5e">sit in the silence, let them drive</text>
  <text x="600" y="381" text-anchor="middle" font-size="11" fill="#2f6f5e">it actually sticks</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a8f98"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2f6f5e"/></marker>
  </defs>
</svg>
