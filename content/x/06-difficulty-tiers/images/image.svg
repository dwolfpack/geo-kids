<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1200" height="675" fill="#f4f1eb"/>
  <text x="600" y="60" text-anchor="middle" font-size="28" fill="#26323a" font-weight="bold">geo-kids difficulty tiers, before / after</text>

  <!-- BEFORE: by population -->
  <text x="290" y="110" text-anchor="middle" font-size="20" fill="#c0463f" font-weight="bold">Before — by population</text>
  <g font-size="14" fill="#26323a">
    <rect x="120" y="140" width="60" height="260" fill="#e6b3ae"/>
    <text x="150" y="415" text-anchor="middle">L1 · 30</text>
    <rect x="200" y="140" width="60" height="260" fill="#e6b3ae"/>
    <text x="230" y="415" text-anchor="middle">L2 · 30</text>
    <rect x="280" y="140" width="60" height="260" fill="#e6b3ae"/>
    <text x="310" y="415" text-anchor="middle">L3 · 30</text>
    <rect x="360" y="358" width="60" height="42" fill="#c0463f"/>
    <text x="390" y="415" text-anchor="middle">L4 · 5</text>
    <rect x="440" y="358" width="60" height="42" fill="#c0463f"/>
    <text x="470" y="415" text-anchor="middle">L5 · 5</text>
  </g>
  <text x="290" y="450" text-anchor="middle" font-size="15" fill="#8a4a45">tidy number. wrong proxy.</text>

  <!-- AFTER: by recognizability -->
  <text x="900" y="110" text-anchor="middle" font-size="20" fill="#2f5d62" font-weight="bold">After — by kid recognizability</text>
  <g font-size="14" fill="#26323a">
    <rect x="730" y="150" width="60" height="250" fill="#a9c9c3"/>
    <text x="760" y="415" text-anchor="middle">L1 · 39</text>
    <rect x="810" y="150" width="60" height="250" fill="#a9c9c3"/>
    <text x="840" y="415" text-anchor="middle">L2 · 39</text>
    <rect x="890" y="150" width="60" height="250" fill="#a9c9c3"/>
    <text x="920" y="415" text-anchor="middle">L3 · 39</text>
    <rect x="970" y="150" width="60" height="250" fill="#a9c9c3"/>
    <text x="1000" y="415" text-anchor="middle">L4 · 39</text>
    <rect x="1050" y="153" width="60" height="247" fill="#2f5d62"/>
    <text x="1080" y="415" text-anchor="middle">L5 · 38</text>
  </g>
  <text x="900" y="450" text-anchor="middle" font-size="15" fill="#2f5d62">even split. right proxy.</text>

  <text x="600" y="530" text-anchor="middle" font-size="22" fill="#26323a" font-weight="bold">Japan (small pop.) beat Bangladesh (huge pop.) instantly</text>
  <text x="600" y="565" text-anchor="middle" font-size="18" fill="#5c6b73">the objective number wasn't the number that mattered</text>
</svg>
