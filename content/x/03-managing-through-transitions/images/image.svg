<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1200" height="675" fill="#f4f1eb"/>
  <text x="600" y="70" text-anchor="middle" font-size="30" fill="#26323a" font-weight="bold">What people need during a transition</text>

  <!-- two gap lines -->
  <g>
    <text x="150" y="140" font-size="20" fill="#26323a" font-weight="bold">Process changes</text>
    <line x1="150" y1="160" x2="1050" y2="160" stroke="#a9762f" stroke-width="6"/>
    <polygon points="1050,160 1030,150 1030,170" fill="#a9762f"/>

    <text x="150" y="260" font-size="20" fill="#26323a" font-weight="bold">People absorb it</text>
    <line x1="150" y1="280" x2="620" y2="280" stroke="#2f5d62" stroke-width="6"/>
    <polygon points="620,280 600,270 600,290" fill="#2f5d62"/>
  </g>

  <!-- the gap zone -->
  <rect x="620" y="200" width="430" height="140" fill="#f0dede" stroke="#c0463f" stroke-width="2" stroke-dasharray="6 5" rx="10"/>
  <text x="835" y="260" text-anchor="middle" font-size="20" fill="#c0463f" font-weight="bold">the trust gap</text>
  <text x="835" y="290" text-anchor="middle" font-size="15" fill="#8a4a45">this is where silence gets filled</text>
  <text x="835" y="315" text-anchor="middle" font-size="15" fill="#8a4a45">with worse guesses than the truth</text>

  <!-- bottom: what closes it -->
  <g transform="translate(0,400)">
    <rect x="150" y="0" width="900" height="200" rx="14" fill="#ffffff" stroke="#26323a" stroke-width="2"/>
    <text x="600" y="45" text-anchor="middle" font-size="22" fill="#26323a" font-weight="bold">What actually closes the gap</text>
    <text x="600" y="90" text-anchor="middle" font-size="18" fill="#26323a">same manager, same days, showing up anyway</text>
    <text x="600" y="125" text-anchor="middle" font-size="18" fill="#26323a">"I don't know yet, I'll tell you Thursday"</text>
    <text x="600" y="160" text-anchor="middle" font-size="18" fill="#26323a">say less than you promise, more than you want to admit</text>
  </g>
</svg>
