  </g>

  <text x="540" y="760" font-family="Verdana, Geneva, sans-serif" font-size="28" fill="#2C4E46" text-anchor="middle">vanilla JS · HTML · CSS</text>
  <text x="540" y="800" font-family="Verdana, Geneva, sans-serif" font-size="28" fill="#2C4E46" text-anchor="middle">no build step, Hebrew-first UI</text>

  <text x="540" y="920" font-family="Verdana, Geneva, sans-serif" font-size="26" fill="#3E6E63" text-anchor="middle">QA department: age 6</text>
